name: Build editor's copy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-copy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the draft
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install renderers
        run: |
          python3 -m venv "$RUNNER_TEMP/ietf-python"
          "$RUNNER_TEMP/ietf-python/bin/python" -m pip install xml2rfc==3.35.0
          gem install --no-document --user-install kramdown-rfc --version 1.7.43
          echo "$RUNNER_TEMP/ietf-python/bin" >> "$GITHUB_PATH"
          ruby -r rubygems -e 'puts File.join(Gem.user_dir, "bin")' >> "$GITHUB_PATH"

      - name: Build and lint
        run: make

      - name: Save the editor's copy as a repository artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: editor-copy
          path: |
            account-bound-agent-delegation/draft-*.html
            account-bound-agent-delegation/draft-*.txt
          if-no-files-found: error
          retention-days: 14

      - name: Stage the public editor's copy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          dir=account-bound-agent-delegation
          draft=draft-steele-oauth-account-bound-agent-delegation
          mkdir -p "_site/$dir"
          cp "$dir/$draft.html" "_site/$dir/index.html"
          cp "$dir/$draft.txt" "_site/$dir/"
          cp .github/pages/index.html _site/

      - name: Upload Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish editor's copy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
